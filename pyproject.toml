[project]
name = "pathoinfer"
version = "0.1.0"
description = "Whole slide image inference for pathotrain models, built on patchology."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "twpkevin06222", email = "tengwaipokevin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "nvidia-ml-py>=13.615.71",          # NVML: GPU utilisation and memory in the run summary
    "opencv-python-headless>=5.0.0.93",
    # Tiling and coordinate changes in patchology are breaking changes for pathoinfer.
    "patchology>=0.1.0,<0.2",
    "polars>=2.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    # Instance post-processing (post/instances.py): HoVer-Net's watershed and its filters.
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2",
    "tifffile>=2026.10.15",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
pathoinfer = "pathoinfer.cli:main"

[project.optional-dependencies]
onnx = ["onnxruntime-gpu>=1.31.1", "onnx>=1.23.2"]
trt = ["tensorrt"]
triton = ["tritonclient[grpc]"]
vllm-client = ["httpx"]
# Offline vLLM generation (runtime/local/vllm_offline.py), in its own venv: vLLM 0.33 pins
# torch 2.14.0, numpy<2.5 (numba), transformers<5.21 and compressed-tensors 0.17, which
# clash with [vlm-convert]; not in [all]. uv locks it as a separate fork ([tool.uv]).
# Python 3.13+: on 3.12 its mistral-common caps numpy below 2.4.
vllm = ["vllm>=0.33.0; python_version >= '3.13' and sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]
# The slide job API; httpx downloads http(s) slides (and drives FastAPI's test client).
serve = ["fastapi", "uvicorn", "httpx"]
# Model conversion: FP16 and ONNX Runtime INT8 (with [onnx]), ModelOpt INT8/FP8.
# ModelOpt's own [onnx] extra pins onnxruntime-gpu<1.31 and onnx~=1.21, which clash with
# the workspace; its ONNX quantiser's imports are listed here instead, at the versions
# verified with onnxruntime-gpu 1.31.1 and onnx 1.23.2 (tests/convert).
convert = [
    "nvidia-modelopt>=0.48.0",
    "onnx>=1.23.2",
    "onnx-graphsurgeon>=0.6.1",
    "onnxslim>=0.1.99",
    "polygraphy>=0.53.6",
    "onnxconverter-common>=1.16.0",
    "onnxscript>=0.7.2",
    "cupy-cuda13x>=14.2.0",
    "lief>=1.0.0",
    "cppimport>=26.4.17",
]
# LoRA merges and VLM weight quantisation (convert/vlm.py).
# llm-compressor caps torch and transformers (0.15: torch<=2.14.1, transformers<=5.21.0),
# so the workspace lock can only move past those when it raises its caps.
vlm-convert = ["llmcompressor>=0.15.0", "peft>=0.21.2"]
mlflow = ["mlflow-skinny"]
hf = ["huggingface-hub"]
# Only for io/interop.py's to_geodataframe(); never used by core or tests.
geopandas = ["geopandas"]
all = ["pathoinfer[onnx,trt,triton,vllm-client,serve,convert,vlm-convert,mlflow,hf,geopandas]"]

[tool.uv]
# [vllm] needs other versions of torch, transformers and compressed-tensors than
# [vlm-convert] (and so [all]); these let the workspace lock resolve each on its own.
conflicts = [
    [{ package = "pathoinfer", extra = "vllm" }, { package = "pathoinfer", extra = "vlm-convert" }],
    [{ package = "pathoinfer", extra = "vllm" }, { package = "pathoinfer", extra = "all" }],
]

# CUDA 13.0 builds of torch, as in pathotrain; uv needs one torch source per workspace.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "LOG", "T20", "TID", "UP"]

# The hard rules in CLAUDE.md that a linter can enforce.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Log with loguru: from loguru import logger (see pathoinfer._logging)."
"pandas".msg = "No pandas: tables are Polars, queries are DuckDB."
"geopandas".msg = "No geopandas: geometry is shapely, tables are Polars."
"pathotrain".msg = "pathoinfer never imports pathotrain; the contract is the exported model metadata."
"rasterio".msg = "No rasterio: vectorise with OpenCV and shapely."
"osgeo".msg = "No GDAL: vectorise with OpenCV and shapely."
"openslide".msg = "Read slides through patchology (patchology.open_slide), never openslide directly."
"vllm".msg = "Only runtime/local/vllm_offline.py loads vllm, lazily (require); elsewhere talk to a vLLM server over HTTP (runtime/remote/vllm.py)."

[tool.ruff.lint.flake8-bugbear]
# patchology's config dataclasses are frozen, so sharing one default instance is safe.
extend-immutable-calls = ["patchology.ArtifactConfig", "patchology.ColorConfig", "patchology.TissueConfig"]

[tool.ruff.lint.isort]
known-first-party = ["patchology", "pathoinfer"]

[tool.ruff.lint.per-file-ignores]
"src/pathoinfer/io/interop.py" = ["TID251"]  # the one geopandas interop helper
"deploy/demo/*" = ["T20"]  # demo scripts report to the terminal

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# shapely 2, ModelOpt, nvidia-ml-py (pynvml) and scipy ship no type information (types-shapely
# and scipy-stubs would add theirs).
module = ["shapely", "shapely.*", "modelopt.*", "pynvml", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU; skipped when none is available",
    "slow: minutes, and a real model or servers named by environment variables",
]
