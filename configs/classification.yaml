# classification inference settings; load with pathoinfer.config.load_config.
task: classification
model: models/classification               # example; a model folder, models:/NAME@ALIAS or hf://ORG/REPO

# Passed to patchology. Tile size and mpp come from the model; slides that do not
# report their resolution are refused.
patchology:
  backend: openslide              # or fastslide
  icc: true                       # ICC profile -> sRGB; pathotrain trains with it on
  tile_overlap: null              # null: the model card's recommended_overlap
  tissue_overlap: 0.1             # keep tiles with at least this fraction of tissue
  tissue: {method: triangle}      # patchology TissueConfig fields
  artifacts: {pen: true, blur: false}  # patchology ArtifactConfig fields

# How the model executes.
runtime:
  device: auto                    # cuda when available, else cpu; or cpu, cuda, cuda:1
  batch_size: 32                  # fixed; the last batch is padded
  tensorrt: true                  # ONNX models use the TensorRT EP when it loads
  autocast: null                  # PyTorch models only: bf16 or fp16

# Default: tab20 colours in class order. Replace any by class name.
class_colors: {}                  # e.g. {tumor: [255, 0, 0]}
